# Gas takeaway map. Listens only on 8443.
# Ports 80 and 443 stay on propeval.simba.services.
# The certificate is a Let's Encrypt short-lived IP certificate
# (about six days). Renewal is certbot-energy.timer, which uses
# /etc/letsencrypt-energy and does not read /etc/letsencrypt.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name 204.168.132.89;

    ssl_certificate /etc/letsencrypt-energy/live/204.168.132.89/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-energy/live/204.168.132.89/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ENERGY:10m;

    root /var/www/energy;
    index index.html;

    location /data/ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
    }
}
