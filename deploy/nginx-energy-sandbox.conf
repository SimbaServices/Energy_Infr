# Sandbox copy of the gas takeaway map. Listens only on 8444.
# Production stays on 8443 and /var/www/energy.
# Same IP certificate as production. This file does not change that lineage.

server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    http2 on;
    server_name 204.168.132.89;

    ssl_certificate /etc/letsencrypt-energy/live/204.168.132.89/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-energy/live/204.168.132.89/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ENERGYSB:10m;

    root /var/www/energy-sandbox;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8766;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
    }

    location /data/ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
    }
}
